services:
  postgres:
    image: postgres:16-alpine
    container_name: claim-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claim_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-claim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claim_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claim_user} -d ${POSTGRES_DB:-claim_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claim_user}:${POSTGRES_PASSWORD:-claim_password}@postgres:5432/${POSTGRES_DB:-claim_assistant}
      FRONTEND_ORIGIN: ${DOCKER_FRONTEND_ORIGIN:-http://localhost:8000}
      UPLOAD_ROOT: /app/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - claim-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
  claim-uploads:
