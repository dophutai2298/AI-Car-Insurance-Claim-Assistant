services:
  postgres:
    image: postgres:16-alpine
    container_name: claim-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claim_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-claim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claim_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claim_user} -d ${POSTGRES_DB:-claim_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
